<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinner? ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #fff1f5, #fff8ed);
  color: #542b36;
}

.card {
  width: 90%;
  max-width: 440px;
  padding: 42px 25px;
  text-align: center;
  background: rgba(255,255,255,0.9);
  border-radius: 30px;
  box-shadow: 0 20px 60px rgba(130,65,85,0.2);
  position: relative;
  z-index: 2;
}

.emoji {
  font-size: 50px;
}

h1 {
  font-size: 32px;
  line-height: 1.2;
  color: #7b3046;
  margin: 18px 0 14px;
}

.subtitle {
  font-family: Arial, sans-serif;
  color: #805f67;
  line-height: 1.6;
  margin-bottom: 30px;
}

.buttons {
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

button {
  border: none;
  border-radius: 50px;
  padding: 15px 27px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

#yes {
  color: white;
  background: linear-gradient(135deg, #e75480, #c92f61);
  box-shadow: 0 10px 25px rgba(201,47,97,0.3);
}

#no {
  color: #8b5362;
  background: #f8e9ed;
}

.hint {
  height: 25px;
  margin-top: 15px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: #aa7b86;
}

.success {
  display: none;
}

.big-heart {
  font-size: 75px;
}

.heart {
  position: fixed;
  bottom: -30px;
  color: #e75480;
  opacity: 0.4;
  pointer-events: none;
  animation: rise 7s linear forwards;
  z-index: 1;
}

@keyframes rise {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }

  15% {
    opacity: 0.4;
  }

  to {
    transform: translateY(-110vh) rotate(35deg);
    opacity: 0;
  }
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.15);
  }
}

.big-heart {
  animation: pulse 1.2s infinite;
}
</style>
</head>

<body>

<div class="card" id="questionCard">

  <div class="emoji">🍷✨</div>

  <h1>
    Will you go to Dinner with Akash tonight?
  </h1>

  <p class="subtitle">
    Just a little dinner, some good food,<br>
    and hopefully some lovely company. ❤️
  </p>

  <div class="buttons">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 🙈</button>
  </div>

  <div class="hint" id="hint"></div>

</div>


<div class="card success" id="successCard">

  <div class="big-heart">💖</div>

  <h1>Yay! dinner tonight! 🥰</h1>

  <p class="subtitle">
    Akash is officially very happy right now. ❤️
    <br><br>
    See you tonight! ✨🍷
  </p>

</div>


<script>

var yesButton = document.getElementById("yes");
var noButton = document.getElementById("no");
var hint = document.getElementById("hint");

var questionCard = document.getElementById("questionCard");
var successCard = document.getElementById("successCard");

var noClicks = 0;

var messages = [
  "Are you sure? 🥺",
  "Really sure? 🙈",
  "Think about the dinner... 🍝",
  "I'll be very sad... 🥹",
  "One tiny dinner? ❤️",
  "Pretty please? 🥺💕",
  "The No button is getting shy now...",
  "Okay... you know what to do 😌❤️"
];


noButton.addEventListener("click", function() {

  noClicks++;

  var noScale = Math.max(0.12, 1 - noClicks * 0.13);
  var yesScale = Math.min(2.4, 1 + noClicks * 0.16);

  noButton.style.transform = "scale(" + noScale + ")";
  yesButton.style.transform = "scale(" + yesScale + ")";

  noButton.style.opacity = Math.max(
    0.25,
    1 - noClicks * 0.1
  );

  var messageIndex = Math.min(
    noClicks - 1,
    messages.length - 1
  );

  hint.textContent = messages[messageIndex];

});


yesButton.addEventListener("click", function() {

  questionCard.style.display = "none";
  successCard.style.display = "block";

  createHearts(25);

});


function createHeart() {

  var heart = document.createElement("div");

  heart.className = "heart";

  if (Math.random() > 0.5) {
    heart.textContent = "♥️";
  } else {
    heart.textContent = "♡";
  }

  heart.style.left = Math.random() * 100 + "vw";

  heart.style.fontSize =
    (14 + Math.random() * 24) + "px";

  heart.style.animationDuration =
    (5 + Math.random() * 6) + "s";

  document.body.appendChild(heart);

  setTimeout(function() {
    heart.remove();
  }, 12000);

}


function createHearts(amount) {

  for (var i = 0; i < amount; i++) {

    setTimeout(function() {
      createHeart();
    }, i * 120);

  }

}


setInterval(function() {
  createHeart();
}, 900);

</script>

</body>
</html>
